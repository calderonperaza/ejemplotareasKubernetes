apiVersion: v1
kind: Namespace
metadata:
   name: ejemplo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: ejemplo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: ejemplo
spec:
  selector:
    matchLabels:
      app: mongo
  replicas: 1
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:5.0.6-focal
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: storage
              mountPath: /data/db
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: ejemplo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
#      nodePort: 30017  #no va si es ClusterIP
#  type: NodePort  #cambiar a ClusterIP si no se quiere exponer fuera del cluster
# nombre del servicio completo: mongo.ejemplo.svc.cluster.local
#comando para probar con un pod temporal el servicio
#kubectl run pod-prueba --rm -it --image=curlimages/curl -n default -- curl -v http://mongo.ejemplo.svc.cluster.local:27017